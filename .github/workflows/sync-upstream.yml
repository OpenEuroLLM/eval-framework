name: Sync upstream release

# Runs nightly, but only changes anything when Aleph-Alpha-Research/eval-framework
# has published a new GitHub Release.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to sync (blank = latest release)"
        required: false
        type: string

# Deny by default; the single job below grants itself the minimum it needs.
permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Aleph-Alpha-Research/eval-framework

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the mirrored tree and push the tag
    steps:
      - name: Check out the mirror
        # First-party action. To remove even this trust assumption, pin by digest:
        #   gh api repos/actions/checkout/commits/v4 --jq .sha
        uses: actions/checkout@v4

      - name: Resolve upstream release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env, never interpolated into the script body, so a hostile
          # dispatch input cannot become shell.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$'; then
            echo "::error::implausible tag: $TAG"
            exit 1
          fi
          CURRENT="$(python3 -c 'import json; print(json.load(open(".mirror/state.json")).get("tag") or "")')"
          {
            echo "tag=$TAG"
            echo "current=$CURRENT"
          } >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "$CURRENT" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Mirror already at \`$TAG\`. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream released \`$TAG\`; mirror is at \`${CURRENT:-nothing}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Materialise upstream tree
        if: steps.resolve.outputs.changed == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: .mirror/sync.sh "$TAG"

      - name: Commit and push
        if: steps.resolve.outputs.changed == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::warning::New tag $TAG but tree is identical; nothing committed."
            exit 0
          fi
          COMMIT="$(python3 -c 'import json; print(json.load(open(".mirror/state.json"))["commit"])')"
          git commit \
            --message "chore: sync upstream ${TAG}" \
            --message "Mirrored from https://github.com/${UPSTREAM_REPO} at ${TAG} (${COMMIT}).

          Upstream .github/ and CODEOWNERS are intentionally not mirrored.
          Generated by .github/workflows/sync-upstream.yml; do not edit by hand."
          git tag --annotate "upstream-${TAG}" --message "${UPSTREAM_REPO} ${TAG}"
          git push origin HEAD
          git push origin "refs/tags/upstream-${TAG}"
          echo "Synced to \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
